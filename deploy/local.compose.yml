services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: lu4
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: lu4
    ports: [127.0.0.1:55432:5432]
    volumes: [local_database:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U lu4']
      interval: 2s
      retries: 20
volumes:
  local_database:
