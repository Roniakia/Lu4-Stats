services:
  database:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lu4
      POSTGRES_USER: lu4_migration
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - database:/var/lib/postgresql
    ports:
      - ${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lu4_migration -d lu4']
      interval: 10s
      timeout: 3s
      retries: 10
    shm_size: 256m
    mem_limit: 2g
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  migrate:
    image: ${TOOLS_IMAGE:?Set immutable TOOLS_IMAGE tag}
    profiles: [tools]
    command: [scripts/migrate.mjs]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set migration connection}
    depends_on:
      database: {condition: service_healthy}
  collector:
    image: ${COLLECTOR_IMAGE:?Set immutable COLLECTOR_IMAGE tag}
    restart: unless-stopped
    init: true
    environment:
      COLLECTOR_DATABASE_URL: ${COLLECTOR_DATABASE_URL:?Set limited writer connection}
      COLLECTION_INTERVAL_SECONDS: 900
      COLLECTION_TIMEOUT_SECONDS: 600
    depends_on:
      database: {condition: service_healthy}
    shm_size: 512m
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 90s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  provision-roles:
    image: postgres:18-bookworm
    profiles: [tools]
    entrypoint: [bash, /ops/provision-roles.sh]
    environment:
      PGHOST: database
      PGUSER: lu4_migration
      PGDATABASE: lu4
      PGPASSWORD_FILE: /run/secrets/database_password
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set app password}
      COLLECTOR_DATABASE_PASSWORD: ${COLLECTOR_DATABASE_PASSWORD:?Set collector password}
      ADMIN_DATABASE_PASSWORD: ${ADMIN_DATABASE_PASSWORD:?Set admin password}
    secrets: [database_password]
    volumes:
      - ./ops:/ops:ro
      - ../database/roles.sql:/roles.sql:ro
    depends_on:
      database: {condition: service_healthy}
  admin-export:
    image: ${TOOLS_IMAGE:?Set immutable TOOLS_IMAGE tag}
    profiles: [tools]
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?Use read-only database role}
      ARCHIVE_DIR: /archives
      EXPORT_DIR: /exports
    volumes:
      - ${ARCHIVE_DIRECTORY:?Set archive directory}:/archives:ro
      - ${EXPORT_DIRECTORY:?Set protected export directory}:/exports
    mem_limit: 1g
    cpus: 1
    command: [scripts/admin/export.mjs, catalog]
  prepare-storage:
    image: ${TOOLS_IMAGE:?Set immutable TOOLS_IMAGE tag}
    profiles: [tools]
    user: root
    entrypoint: [sh, -c]
    command: ['chown node:node /archives /exports && chmod 700 /archives /exports']
    volumes:
      - ${ARCHIVE_DIRECTORY:?Set archive directory}:/archives
      - ${EXPORT_DIRECTORY:?Set protected export directory}:/exports
    mem_limit: 128m
  backup:
    image: postgres:18-bookworm
    profiles: [tools]
    # Read the owner-only host secret; files remain root-owned and private.
    user: root
    entrypoint: [bash, /ops/backup.sh]
    environment:
      PGHOST: database
      PGUSER: lu4_migration
      PGDATABASE: lu4
      PGPASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - ./ops:/ops:ro
      - ${BACKUP_DIRECTORY:?Set protected backup directory}:/backups
    mem_limit: 512m
    cpus: 1
secrets:
  database_password:
    file: ${DATABASE_PASSWORD_FILE:?Set password file path}
volumes:
  database:
