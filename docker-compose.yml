services:
  snapshot-publisher:
    build:
      context: .
      args:
        PUBLISHER_UID: ${PUBLISHER_UID:-1000}
        PUBLISHER_GID: ${PUBLISHER_GID:-1000}
    image: lu4-stats-snapshot-publisher:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      HOME: /home/pwuser
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-900}
      CHROMIUM_SANDBOX: ${CHROMIUM_SANDBOX:-true}
      SNAPSHOT_GIT_REMOTE: ${SNAPSHOT_GIT_REMOTE:-git@github.com:Roniakia/Lu4-Stats.git}
      SNAPSHOT_GIT_BRANCH: ${SNAPSHOT_GIT_BRANCH:-data}
      SNAPSHOT_GIT_NAME: ${SNAPSHOT_GIT_NAME:-Lu4 Stats Snapshot Bot}
      SNAPSHOT_GIT_EMAIL: ${SNAPSHOT_GIT_EMAIL:-lu4-stats-bot@users.noreply.github.com}
      MW2_BASE_URL: ${MW2_BASE_URL:-https://mw2.global}
      GIT_SSH_COMMAND: >-
        ssh -i /run/secrets/github_deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15
        -o StrictHostKeyChecking=yes
        -o UserKnownHostsFile=/home/pwuser/.ssh/known_hosts
    volumes:
      - ${GITHUB_SSH_KEY_PATH:?Set GITHUB_SSH_KEY_PATH in .env}:/run/secrets/github_deploy_key:ro
      - ${GITHUB_KNOWN_HOSTS_PATH:?Set GITHUB_KNOWN_HOSTS_PATH in .env}:/home/pwuser/.ssh/known_hosts:ro
    shm_size: 1gb
    tmpfs:
      - /tmp:size=1gb,mode=1777
      - /home/pwuser/.cache:size=512m,uid=${PUBLISHER_UID:-1000},gid=${PUBLISHER_GID:-1000}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
