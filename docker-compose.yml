services:
  snapshot-publisher:
    build: .
    image: lu4-stats-snapshot-publisher:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      HOME: /home/pwuser
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-900}
      CHROMIUM_SANDBOX: ${CHROMIUM_SANDBOX:-false}
      SNAPSHOT_GIT_REMOTE: ${SNAPSHOT_GIT_REMOTE:-git@github.com:Roniakia/Lu4-Stats.git}
      SNAPSHOT_GIT_BRANCH: ${SNAPSHOT_GIT_BRANCH:-data}
      SNAPSHOT_GIT_NAME: ${SNAPSHOT_GIT_NAME:-Lu4 Stats Snapshot Bot}
      SNAPSHOT_GIT_EMAIL: ${SNAPSHOT_GIT_EMAIL:-lu4-stats-bot@users.noreply.github.com}
      MW2_BASE_URL: ${MW2_BASE_URL:-https://mw2.global}
    volumes:
      - ${GITHUB_SSH_KEY_PATH:-/mnt/user/appdata/lu4-stats-snapshot-publisher/github_deploy_key}:/run/secrets/github_deploy_key:ro
    shm_size: 1gb
    tmpfs:
      - /tmp:size=1073741824
      - /home/pwuser/.cache:size=536870912,uid=1000,gid=1000
      - /run/publisher-ssh:size=16777216
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
